<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Amboss. Kräftige Flächen statt feiner Linien: das Symbol muss auch als
       16-px-Favicon noch als Amboss lesbar sein, nicht als Fleck. Ein einzelner
       Funke — zwei wurden bei kleiner Darstellung zu Rauschen. -->
  <rect width="32" height="32" rx="6" fill="#0c0c0e"/>

  <path d="M23.6 4.4l1.15 2.55 2.55 1.15-2.55 1.15-1.15 2.55-1.15-2.55-2.55-1.15 2.55-1.15z"
        fill="#e8a23d" opacity=".8"/>

  <g fill="#e8a23d">
    <!-- Bahn mit Horn nach links -->
    <path d="M2.4 14.6 8 11.3h18v6.6H8z"/>
    <!-- Taille, nach unten ausladend -->
    <path d="M12.6 17.9h6.8l1.7 5.3h-10.2z"/>
    <!-- Fuß -->
    <path d="M7.4 23.2h17.2v4.4H7.4z"/>
  </g>
</svg>
